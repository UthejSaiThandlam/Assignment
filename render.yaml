
databases:
  - name: talentflow-db
    databaseName: talentflow
    user: talentflow_user
    region: oregon
    plan: free

services:
  # Django REST API Backend
  - type: web
    name: talentflow-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_data && gunicorn ats_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentflow-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: talentflow-api.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://talentflow-ats.onrender.com,http://localhost:5173

  # React Vite Frontend Static Site
  - type: web
    name: talentflow-ats
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://talentflow-api.onrender.com/api
